name: Fork APK
on:
  push:
    branches: [preserve-dashboard-on-network-switch]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build-env
        with:
          mock-google-services: 'true'
          cache-disabled: 'true'
          cache-encryption-key: ''
      - run: ./gradlew :app:testMinimalDebugUnitTest --tests '*FrontendViewModelTest' :app:assembleMinimalDebug -PnoStrictMode
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: home-assistant-fork
          path: app/build/outputs/apk/minimal/debug/*.apk
          if-no-files-found: error
